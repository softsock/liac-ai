[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liac-ai"
version = "0.1.0"
description = "Autonomous AI VTuber character runtime"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
nemotron = ["tokenizers==0.22.2"]
desktop = ["PySide6-Essentials>=6.10,<7"]

[project.scripts]
vtuber = "vtuber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vtuber.minds" = ["character.md", "deep.md"]
"vtuber.lab" = ["simulator.md", "scenarios/*.json"]
